---
name: bake-ansible-images-v1
'on': workflow_call
jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ansible-lint
        uses: ansible/ansible-lint@v25
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      distro: ${{ steps.read-matrix.outputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: read platform-matrix-v1.json
        id: read-matrix
        run: echo "distro=$(jq -cr '@json' < platform-matrix-v1.json)" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.prepare-matrix.outputs.distro) }}
    steps:
      - uses: actions/checkout@v4
      - name: test role
        uses: dagger/dagger-for-github@8.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          module: https://github.com/andrewrothstein/docker-ansible@feature/test-role-push
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: >-
            test-role
            --role-name=${{ github.event.repository.name }}
            --role-dir=.
            --os=${{ matrix.distro.OS }}
            --os-ver=${{ matrix.distro.OS_VER }}
            --target-username=${{ github.actor }}
            --target-password=env:GITHUB_TOKEN
            --platforms=${{ matrix.distro.platforms }}

      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}:0.0.0-${{ matrix.distro.OS }}.${{ matrix.distro.OS_VER }}"
          severity: 'CRITICAL,HIGH'
          format: sarif
          output: trivy-results.sarif
          timeout: '15m0s'
          github-pat: "${{ github.token }}"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
